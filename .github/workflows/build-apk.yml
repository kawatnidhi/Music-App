name: 📱 Build & Release SoundVault Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Clean & Generate Native Android Platform Files
        working-directory: dart_app
        run: |
          rm -rf android
          flutter create . --org com.soundvault --platforms android --project-name ad_free_music_app
          
          # Inject Streaming and Network Permissions into AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml

      - name: 📦 Install Flutter Dependencies
        working-directory: dart_app
        run: flutter pub get

      - name: 🚀 Compile Release APK
        working-directory: dart_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload Release APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundVault-Music-App-Release
          path: dart_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
