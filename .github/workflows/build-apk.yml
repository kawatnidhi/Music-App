name: 📱 Build & Release SoundVault Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter 3.22.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 🛠️ Initialize Android Project Structure
        working-directory: dart_app
        run: |
          flutter create . --org com.soundvault --platforms android
          flutter pub get

      - name: 🚀 Build Release APK
        working-directory: dart_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundVault-Music-App-Release
          path: dart_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
