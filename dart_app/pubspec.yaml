name: ad_free_music_app
description: "A modern, ad-free music streaming app built with Dart and Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Networking & HTTP
  http: ^1.1.2
  
  # Audio Playback Engine & Background Service
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  
  # File System & Offline Downloads
  path_provider: ^2.1.2
  
  # UI, Icons, Typography & Cached Images
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_staggered_animations: ^1.1.1
  font_awesome_flutter: ^10.7.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
